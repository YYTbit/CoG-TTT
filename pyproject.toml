[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cog-ttt"
version = "1.0.0"
description = "CoG-TTT: Joint Test-Time Training for Evolving Agentic Graphs"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26,<3", "PyYAML>=6,<7"]

[project.optional-dependencies]
models = ["torch>=2.6,<3", "transformers>=4.57,<5", "accelerate>=1.5,<2", "peft>=0.17,<1", "safetensors>=0.4"]
test = ["pytest>=8,<9"]

[project.scripts]
cog-ttt = "cog_ttt.cli:main"

[tool.setuptools.packages.find]
include = ["cog_ttt*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
